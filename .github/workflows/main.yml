name: Build Vynnify Aim Tweaks

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "Vynnify Aim Tweaks" app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vynnify-Aim-Tweaks-Windows
          path: dist/Vynnify Aim Tweaks.exe
